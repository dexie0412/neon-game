<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Hunt</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #02020a;
      font-family: Arial, sans-serif;
      color: white;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
      background:
        linear-gradient(rgba(0,255,255,0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,0,255,0.08) 1px, transparent 1px),
        radial-gradient(circle at bottom, #101060, #02020a 60%);
      background-size: 40px 40px, 40px 40px, 100% 100%;
    }

    #title {
      position: absolute;
      top: 20px;
      left: 30px;
      font-size: 40px;
      font-weight: bold;
      color: #00ffff;
      text-shadow:
        0 0 10px #00ffff,
        0 0 20px #00ffff,
        4px 4px #ff00ff;
    }

    #score {
      position: absolute;
      top: 25px;
      right: 30px;
      padding: 12px 20px;
      border: 2px solid #ff00ff;
      border-radius: 12px;
      color: #ff66ff;
      box-shadow: 0 0 20px #ff00ff;
      font-size: 22px;
    }

    #player {
      position: absolute;
      width: 35px;
      height: 35px;
      background: #00ffff;
      border: 3px solid white;
      box-shadow:
        0 0 10px white,
        0 0 20px #00ffff,
        0 0 40px #00ffff;
      transform: rotate(45deg);
    }

    .orb {
      position: absolute;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #ff00ff;
      border: 2px solid white;

      box-shadow:
        0 0 10px white,
        0 0 25px #ff00ff,
        0 0 50px #ff00ff;

      animation: glow 1s infinite alternate;
    }

    @keyframes glow {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.3);
      }
    }

    #instructions {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #aaa;
    }

    #win {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);

      align-items: center;
      justify-content: center;
      flex-direction: column;

      z-index: 10;
    }

    #win h1 {
      font-size: 70px;
      color: #00ffff;

      text-shadow:
        0 0 10px #00ffff,
        0 0 30px #00ffff,
        5px 5px #ff00ff;
    }

    button {
      padding: 15px 30px;
      border: none;
      border-radius: 10px;

      background: #ff00ff;
      color: white;

      font-size: 20px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 0 10px #ff00ff,
        0 0 30px #ff00ff;
    }

    button:hover {
      background: #ff66ff;
    }
  </style>
</head>

<body>

<div id="game">

  <div id="title">NEON HUNT</div>

  <div id="score">
    SCORE: <span id="scoreNumber">0</span>/5
  </div>

  <div id="player"></div>

  <div id="instructions">
    WASD of pijltjestoetsen • Verzamel alle neon-bollen
  </div>

  <div id="win">
    <h1>YOU WIN!</h1>
    <button onclick="restartGame()">OPNIEUW</button>
  </div>

</div>

<script>

const player = document.getElementById("player");
const game = document.getElementById("game");
const scoreDisplay = document.getElementById("scoreNumber");
const winScreen = document.getElementById("win");

let playerX = window.innerWidth / 2;
let playerY = window.innerHeight / 2;

let speed = 7;
let score = 0;

let keys = {};

const totalOrbs = 5;


// -----------------------
// SPELER
// -----------------------

function updatePlayer() {

  if (keys["ArrowUp"] || keys["w"]) {
    playerY -= speed;
  }

  if (keys["ArrowDown"] || keys["s"]) {
    playerY += speed;
  }

  if (keys["ArrowLeft"] || keys["a"]) {
    playerX -= speed;
  }

  if (keys["ArrowRight"] || keys["d"]) {
    playerX += speed;
  }


  // Zorg dat speler niet uit beeld gaat

  playerX = Math.max(
    0,
    Math.min(window.innerWidth - 35, playerX)
  );

  playerY = Math.max(
    80,
    Math.min(window.innerHeight - 70, playerY)
  );


  player.style.left = playerX + "px";
  player.style.top = playerY + "px";


  checkCollision();

  requestAnimationFrame(updatePlayer);
}


// -----------------------
// TOETSEN
// -----------------------

document.addEventListener("keydown", function(event) {

  keys[event.key.toLowerCase()] = true;

});

document.addEventListener("keyup", function(event) {

  keys[event.key.toLowerCase()] = false;

});


// -----------------------
// NEON ORBS
// -----------------------

function createOrb() {

  const orb = document.createElement("div");

  orb.classList.add("orb");


  const x =
    Math.random() * (window.innerWidth - 80) + 40;

  const y =
    Math.random() * (window.innerHeight - 200) + 100;


  orb.style.left = x + "px";
  orb.style.top = y + "px";


  game.appendChild(orb);

}


function createAllOrbs() {

  for (let i = 0; i < totalOrbs; i++) {

    createOrb();

  }

}


// -----------------------
// COLLISIE
// -----------------------

function checkCollision() {

  const playerBox =
    player.getBoundingClientRect();

  const orbs =
    document.querySelectorAll(".orb");


  orbs.forEach(function(orb) {

    const orbBox =
      orb.getBoundingClientRect();


    if (

      playerBox.left < orbBox.right &&
      playerBox.right > orbBox.left &&
      playerBox.top < orbBox.bottom &&
      playerBox.bottom > orbBox.top

    ) {

      orb.remove();

      score++;

      scoreDisplay.textContent = score;


      if (score === totalOrbs) {

        winGame();

      }

    }

  });

}


// -----------------------
// WINNEN
// -----------------------

function winGame() {

  winScreen.style.display = "flex";

}


// -----------------------
// OPNIEUW SPELEN
// -----------------------

function restartGame() {

  document.querySelectorAll(".orb")
    .forEach(function(orb) {

      orb.remove();

    });


  score = 0;

  scoreDisplay.textContent = score;


  playerX = window.innerWidth / 2;
  playerY = window.innerHeight / 2;


  winScreen.style.display = "none";


  createAllOrbs();

}


// Start game

createAllOrbs();

updatePlayer();

</script>

</body>
</html>
