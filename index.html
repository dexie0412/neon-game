<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Neon Run</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #020208;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    touch-action: none;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   ACHTERGROND
========================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(circle at 20% 20%, #102060 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #500050 0%, transparent 30%),
        #020208;

    z-index: -2;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;

    background-image:
        linear-gradient(rgba(0,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,0,255,.04) 1px, transparent 1px);

    background-size: 40px 40px;

    z-index: -1;
}

/* =========================
   GAME
========================= */

#game {
    position: relative;

    width: 95vw;
    max-width: 1100px;

    height: 88vh;
    max-height: 720px;

    background:
        radial-gradient(circle at 50% 100%, #071650 0%, #02030c 60%);

    border: 2px solid #00ffff;
    border-radius: 25px;

    overflow: hidden;

    box-shadow:
        0 0 15px #00ffff,
        0 0 50px rgba(0,255,255,.25),
        inset 0 0 60px rgba(255,0,255,.1);
}

/* Grid */

#grid {
    position: absolute;
    inset: 0;

    background-image:
        linear-gradient(rgba(0,255,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,255,.06) 1px, transparent 1px);

    background-size: 50px 50px;

    pointer-events: none;
}

/* =========================
   BOVENBALK
========================= */

#hud {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 75px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 25px;

    background: rgba(2,4,15,.9);

    border-bottom:
        1px solid rgba(0,255,255,.4);

    z-index: 50;
}

.logo {
    font-size: 30px;
    font-weight: 900;
    font-style: italic;

    letter-spacing: 3px;

    color: white;

    text-shadow:
        0 0 8px #00ffff,
        3px 3px #ff00ff;
}

.stats {
    display: flex;
    gap: 10px;
}

.stat {
    padding: 10px 15px;

    border-radius: 12px;

    background:
        rgba(0,255,255,.07);

    border:
        1px solid rgba(0,255,255,.4);

    color: #aaffff;

    font-weight: bold;
}

/* =========================
   PLAYER
========================= */

#player {
    position: absolute;

    width: 34px;
    height: 34px;

    border-radius: 8px;

    background: #00ffff;

    border: 2px solid white;

    box-shadow:
        0 0 8px white,
        0 0 20px #00ffff,
        0 0 40px #00ffff;

    z-index: 10;
}

#player::after {
    content: "";

    position: absolute;

    width: 12px;
    height: 12px;

    left: 9px;
    top: 9px;

    border-radius: 3px;

    background: #02151a;
}

/* =========================
   KRISTALLEN
========================= */

.crystal {
    position: absolute;

    width: 24px;
    height: 24px;

    background: #ff00e6;

    border: 2px solid white;

    transform: rotate(45deg);

    box-shadow:
        0 0 8px white,
        0 0 18px #ff00e6,
        0 0 40px #ff00e6;

    animation:
        crystalPulse .7s infinite alternate;
}

@keyframes crystalPulse {

    from {
        filter: brightness(.8);
    }

    to {
        filter: brightness(1.8);
    }

}

/* =========================
   VIJANDEN
========================= */

.enemy {
    position: absolute;

    width: 38px;
    height: 38px;

    border-radius: 50%;

    background: #ff1744;

    border: 2px solid #ff9bad;

    box-shadow:
        0 0 10px #ff1744,
        0 0 25px #ff1744;
}

.enemy::before {
    content: "";

    position: absolute;

    width: 6px;
    height: 6px;

    left: 8px;
    top: 11px;

    border-radius: 50%;

    background: white;

    box-shadow:
        14px 0 white;
}

/* =========================
   MUREN
========================= */

.wall {
    position: absolute;

    border-radius: 7px;

    border: 1px solid #8e62ff;

    background:
        linear-gradient(
            90deg,
            #5221aa,
            #174bc4
        );

    box-shadow:
        0 0 12px #6633cc,
        inset 0 0 10px rgba(255,255,255,.15);
}

/* =========================
   START / EINDSCHERM
========================= */

.screen {
    position: absolute;
    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    background:
        rgba(0,0,10,.88);

    backdrop-filter: blur(8px);

    z-index: 200;
}

.hidden {
    display: none;
}

.panel {
    width: min(500px, 88%);

    padding: 40px 25px;

    text-align: center;

    border-radius: 25px;

    border:
        1px solid #00ffff;

    background:
        linear-gradient(
            145deg,
            rgba(0,255,255,.08),
            rgba(255,0,255,.08)
        );

    box-shadow:
        0 0 35px rgba(0,255,255,.25);
}

.panel h1 {
    margin: 0 0 20px;

    font-size:
        clamp(48px, 9vw, 80px);

    line-height: .9;

    font-style: italic;

    text-shadow:
        0 0 12px #00ffff,
        4px 4px #ff00ff;
}

.panel h2 {
    font-size: 45px;

    color: #00ffff;

    text-shadow:
        0 0 20px #00ffff;
}

.panel p {
    color: #bdc9dd;

    line-height: 1.7;
}

.mainButton {
    border: none;

    padding: 15px 32px;

    margin-top: 10px;

    border-radius: 12px;

    color: #001014;

    background: #00ffff;

    font-size: 17px;
    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 0 10px #00ffff,
        0 0 30px rgba(0,255,255,.6);
}

.mainButton:hover {
    background: white;

    transform: scale(1.05);
}

/* =========================
   MOBIELE KNOPPEN
========================= */

#mobileControls {
    display: none;

    position: absolute;

    left: 20px;
    bottom: 20px;

    width: 180px;
    height: 180px;

    z-index: 100;
}

.moveButton {
    position: absolute;

    width: 58px;
    height: 58px;

    border-radius: 16px;

    border:
        2px solid #00ffff;

    background:
        rgba(0,20,35,.88);

    color: white;

    font-size: 25px;
    font-weight: bold;

    display: flex;

    justify-content: center;
    align-items: center;

    box-shadow:
        0 0 10px rgba(0,255,255,.7),
        inset 0 0 12px rgba(0,255,255,.2);

    user-select: none;
    touch-action: none;
}

.moveButton.active {
    background: #00ffff;

    color: #001014;

    transform: scale(.92);

    box-shadow:
        0 0 10px white,
        0 0 25px #00ffff;
}

/* D-pad */

#up {
    top: 0;
    left: 61px;
}

#left {
    top: 61px;
    left: 0;
}

#down {
    top: 61px;
    left: 61px;
}

#right {
    top: 61px;
    left: 122px;
}

/* =========================
   MOBIEL
========================= */

@media (max-width: 800px), (pointer: coarse) {

    #game {
        width: 100vw;
        height: 100vh;

        max-width: none;
        max-height: none;

        border: none;
        border-radius: 0;
    }

    #mobileControls {
        display: block;
    }

    #hud {
        height: 65px;

        padding: 0 12px;
    }

    .logo {
        font-size: 19px;

        letter-spacing: 1px;
    }

    .stat {
        padding: 7px 9px;

        font-size: 12px;
    }

}

/* Kleinere telefoons */

@media (max-width: 400px) {

    #mobileControls {
        transform: scale(.85);

        transform-origin:
            bottom left;
    }

}

</style>
</head>

<body>

<div id="game">

<div id="grid"></div>


<!-- HUD -->

<div id="hud">

    <div class="logo">
        NEON RUN
    </div>

    <div class="stats">

        <div class="stat">
            💎
            <span id="score">0</span>/8
        </div>

        <div class="stat">
            ❤️
            <span id="lives">3</span>
        </div>

    </div>

</div>


<!-- PLAYER -->

<div id="player"></div>


<!-- MOBIELE BESTURING -->

<div id="mobileControls">

    <div
        id="up"
        class="moveButton"
        data-key="w"
    >
        ▲
    </div>

    <div
        id="left"
        class="moveButton"
        data-key="a"
    >
        ◀
    </div>

    <div
        id="down"
        class="moveButton"
        data-key="s"
    >
        ▼
    </div>

    <div
        id="right"
        class="moveButton"
        data-key="d"
    >
        ▶
    </div>

</div>


<!-- STARTSCHERM -->

<div
    id="startScreen"
    class="screen"
>

    <div class="panel">

        <h1>
            NEON<br>RUN
        </h1>

        <p>
            Verzamel alle
            <strong style="color:#ff40e9">
                8 neon-kristallen
            </strong>.
        </p>

        <p>
            Pas op voor de
            <strong style="color:#ff4569">
                rode vijanden
            </strong>!
        </p>

        <p>
            💻 WASD / pijltjestoetsen
            <br>
            📱 Touch-knoppen
        </p>

        <button
            class="mainButton"
            id="startButton"
        >
            START GAME
        </button>

    </div>

</div>


<!-- EINDSCHERM -->

<div
    id="endScreen"
    class="screen hidden"
>

    <div class="panel">

        <h2 id="endTitle">
            YOU WIN!
        </h2>

        <p id="endText"></p>

        <button
            class="mainButton"
            id="restartButton"
        >
            OPNIEUW
        </button>

    </div>

</div>

</div>


<script>

/* =========================
   ELEMENTEN
========================= */

const game =
    document.getElementById("game");

const player =
    document.getElementById("player");

const scoreElement =
    document.getElementById("score");

const livesElement =
    document.getElementById("lives");

const startScreen =
    document.getElementById("startScreen");

const endScreen =
    document.getElementById("endScreen");

const startButton =
    document.getElementById("startButton");

const restartButton =
    document.getElementById("restartButton");


/* =========================
   GAME VARIABELEN
========================= */

let gameRunning = false;

let score = 0;

let lives = 3;

const totalCrystals = 8;

const playerSize = 34;

const speed = 5;

let playerX = 100;

let playerY = 150;

let lastHit = 0;

const keys = {};

let enemies = [];

let walls = [];


/* =========================
   TOETSENBORD
========================= */

window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        keys[key] = true;

        if (
            key.startsWith("arrow")
        ) {

            event.preventDefault();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =========================
   TOUCH BESTURING
========================= */

const moveButtons =
    document.querySelectorAll(
        ".moveButton"
    );


moveButtons.forEach(button => {

    const key =
        button.dataset.key;


    function press(event) {

        event.preventDefault();

        keys[key] = true;

        button.classList.add(
            "active"
        );

    }


    function release(event) {

        event.preventDefault();

        keys[key] = false;

        button.classList.remove(
            "active"
        );

    }


    button.addEventListener(
        "pointerdown",
        press
    );


    button.addEventListener(
        "pointerup",
        release
    );


    button.addEventListener(
        "pointercancel",
        release
    );


    button.addEventListener(
        "pointerleave",
        event => {

            if (
                event.pointerType !== "touch"
            ) {

                release(event);

            }

        }
    );

});


/* =========================
   START
========================= */

startButton.addEventListener(
    "click",
    startGame
);


restartButton.addEventListener(
    "click",
    restartGame
);


function startGame() {

    startScreen.classList.add(
        "hidden"
    );

    resetGame();

    gameRunning = true;

}


/* =========================
   RESET
========================= */

function resetGame() {

    document
        .querySelectorAll(
            ".crystal, .enemy, .wall"
        )
        .forEach(element => {

            element.remove();

        });


    score = 0;

    lives = 3;


    scoreElement.textContent =
        score;

    livesElement.textContent =
        lives;


    playerX =
        game.clientWidth / 2;

    playerY =
        game.clientHeight - 120;


    enemies = [];

    walls = [];


    createWalls();

    createCrystals();

    createEnemies();

}


/* =========================
   MUREN MAKEN
========================= */

function createWalls() {

    const layouts = [

        {
            x: .15,
            y: .32,
            width: .22
        },

        {
            x: .62,
            y: .48,
            width: .2
        },

        {
            x: .35,
            y: .68,
            width: .22
        }

    ];


    layouts.forEach(layout => {

        const element =
            document.createElement(
                "div"
            );

        element.className = "wall";


        const wall = {

            x:
                game.clientWidth *
                layout.x,

            y:
                game.clientHeight *
                layout.y,

            w:
                game.clientWidth *
                layout.width,

            h: 17,

            element: element

        };


        element.style.left =
            wall.x + "px";

        element.style.top =
            wall.y + "px";

        element.style.width =
            wall.w + "px";

        element.style.height =
            wall.h + "px";


        game.appendChild(element);

        walls.push(wall);

    });

}


/* =========================
   KRISTALLEN
========================= */

function createCrystals() {

    for (
        let i = 0;
        i < totalCrystals;
        i++
    ) {

        const element =
            document.createElement(
                "div"
            );

        element.className =
            "crystal";


        let crystalX;
        let crystalY;

        let positionGood = false;


        while (!positionGood) {

            crystalX =
                40 +
                Math.random() *
                (game.clientWidth - 80);

            crystalY =
                100 +
                Math.random() *
                (game.clientHeight - 180);


            positionGood = true;


            for (
                const wall of walls
            ) {

                if (
                    crystalX >
                        wall.x - 40 &&

                    crystalX <
                        wall.x +
                        wall.w +
                        40 &&

                    crystalY >
                        wall.y - 40 &&

                    crystalY <
                        wall.y +
                        wall.h +
                        40
                ) {

                    positionGood =
                        false;

                }

            }

        }


        element.style.left =
            crystalX + "px";

        element.style.top =
            crystalY + "px";


        game.appendChild(element);

    }

}


/* =========================
   VIJANDEN
========================= */

function createEnemies() {

    const amount =
        window.innerWidth < 600
            ? 2
            : 3;


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const element =
            document.createElement(
                "div"
            );

        element.className =
            "enemy";


        const enemy = {

            x:
                60 +
                Math.random() *
                Math.max(
                    100,
                    game.clientWidth -
                    120
                ),

            y:
                100 +
                Math.random() *
                Math.max(
                    100,
                    game.clientHeight -
                    250
                ),

            vx:
                Math.random() > .5
                    ? 2
                    : -2,

            vy:
                Math.random() > .5
                    ? 1.5
                    : -1.5,

            element: element

        };


        enemies.push(enemy);

        game.appendChild(element);

    }

}


/* =========================
   COLLISION
========================= */

function collides(a, b) {

    return (

        a.x <
            b.x + b.w &&

        a.x + a.w >
            b.x &&

        a.y <
            b.y + b.h &&

        a.y + a.h >
            b.y

    );

}


/* =========================
   PLAYER BEWEGEN
========================= */

function movePlayer() {

    let nextX =
        playerX;

    let nextY =
        playerY;


    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        nextY -= speed;

    }


    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        nextY += speed;

    }


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        nextX -= speed;

    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        nextX += speed;

    }


    nextX =
        Math.max(
            5,
            Math.min(
                game.clientWidth -
                playerSize -
                5,

                nextX
            )
        );


    nextY =
        Math.max(
            80,
            Math.min(
                game.clientHeight -
                playerSize -
                5,

                nextY
            )
        );


    const nextPlayer = {

        x: nextX,
        y: nextY,
        w: playerSize,
        h: playerSize

    };


    let blocked =
        false;


    for (
        const wall of walls
    ) {

        if (
            collides(
                nextPlayer,
                wall
            )
        ) {

            blocked = true;

            break;

        }

    }


    if (!blocked) {

        playerX =
            nextX;

        playerY =
            nextY;

    }


    player.style.left =
        playerX + "px";

    player.style.top =
        playerY + "px";

}


/* =========================
   KRISTALLEN PAKKEN
========================= */

function checkCrystals() {

    const playerRect =
        player.getBoundingClientRect();


    const crystals =
        document.querySelectorAll(
            ".crystal"
        );


    crystals.forEach(crystal => {

        const rect =
            crystal.getBoundingClientRect();


        if (
            playerRect.left <
                rect.right &&

            playerRect.right >
                rect.left &&

            playerRect.top <
                rect.bottom &&

            playerRect.bottom >
                rect.top
        ) {

            crystal.remove();

            score++;

            scoreElement.textContent =
                score;


            if (
                score >=
                totalCrystals
            ) {

                finishGame(true);

            }

        }

    });

}


/* =========================
   VIJANDEN BEWEGEN
========================= */

function moveEnemies() {

    enemies.forEach(enemy => {

        enemy.x +=
            enemy.vx;

        enemy.y +=
            enemy.vy;


        if (
            enemy.x <= 4 ||
            enemy.x >=
                game.clientWidth - 42
        ) {

            enemy.vx *= -1;

        }


        if (
            enemy.y <= 80 ||
            enemy.y >=
                game.clientHeight - 42
        ) {

            enemy.vy *= -1;

        }


        enemy.element.style.left =
            enemy.x + "px";

        enemy.element.style.top =
            enemy.y + "px";


        checkEnemyCollision(
            enemy
        );

    });

}


/* =========================
   VIJAND HIT
========================= */

function checkEnemyCollision(
    enemy
) {

    if (
        Date.now() -
        lastHit <
        1000
    ) {

        return;

    }


    const playerBox = {

        x: playerX,
        y: playerY,

        w: playerSize,
        h: playerSize

    };


    const enemyBox = {

        x: enemy.x,
        y: enemy.y,

        w: 38,
        h: 38

    };


    if (
        collides(
            playerBox,
            enemyBox
        )
    ) {

        lastHit =
            Date.now();


        lives--;

        livesElement.textContent =
            lives;


        player.style.background =
            "white";


        setTimeout(
            () => {

                player.style.background =
                    "#00ffff";

            },

            200
        );


        if (
            lives <= 0
        ) {

            finishGame(false);

        }

    }

}


/* =========================
   GAME EINDE
========================= */

function finishGame(won) {

    gameRunning =
        false;


    document.getElementById(
        "endTitle"
    ).textContent =
        won
            ? "YOU WIN!"
            : "GAME OVER";


    document.getElementById(
        "endText"
    ).textContent =
        won
            ? "Je hebt alle 8 neon-kristallen verzameld!"
            : "Je hebt geen levens meer.";


    endScreen.classList.remove(
        "hidden"
    );

}


/* =========================
   OPNIEUW
========================= */

function restartGame() {

    endScreen.classList.add(
        "hidden"
    );

    resetGame();

    gameRunning =
        true;

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    if (gameRunning) {

        movePlayer();

        moveEnemies();

        checkCrystals();

    }


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
</html>
